apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agxiome.fullname" . }}-config
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "{{ .Values.config.logLevel }}",
          "AGXIOME": "{{ .Values.config.logLevel }}"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agxiome.fullname" . }}-secrets
type: Opaque
stringData:
  deepseek-api-key: {{ .Values.config.deepseekApiKey }}
  openai-api-key: {{ .Values.config.openaiApiKey }}
