apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agxiome.fullname" . }}
  labels:
    app: {{ include "agxiome.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "agxiome.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "agxiome.name" . }}
    spec:
      containers:
        - name: agxiome
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.config.environment }}
            - name: DEEPSEEK_API_KEY
              value: {{ .Values.config.deepseekApiKey }}
            - name: OPENAI_API_KEY
              value: {{ .Values.config.openaiApiKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agxiome.fullname" . }}-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ include "agxiome.name" . }}
