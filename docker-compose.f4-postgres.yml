services:
  f4-postgres:
    image: pgvector/pgvector:pg17
    container_name: agxioma-f4-postgres
    environment:
      POSTGRES_DB: agxiome_f4
      POSTGRES_USER: agxiome
      POSTGRES_PASSWORD: agxiome_f4_pw
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agxiome -d agxiome_f4"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped