version: "3.9"

# AGXIOME Integration Test Stack
# Usage: docker-compose -f docker-compose.test.yml up -d
# Then run: cd src && dotnet test AGXIOME.Tests/AGXIOME.Tests.csproj --verbosity minimal

services:
  # ── Redis (F4 RequiresRedisFact port 6390 + F7 port 6379) ─────────────────
  redis-test:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL (F4 RequiresPostgresRealFact port 55432) ───────────────────
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agxiome
      POSTGRES_PASSWORD: agxiome_test
      POSTGRES_DB: agxiome_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agxiome -d agxiome_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Meilisearch (F4 RequiresDockerFact – Meilisearch) ─────────────────────
  meilisearch-test:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "test_master_key"
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Elasticsearch (F4 RequiresDockerFact – Elasticsearch) ─────────────────
  elasticsearch-test:
    image: elasticsearch:8.13.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── DynamoDB Local (F4 RequiresDockerFact – DynamoDB) ─────────────────────
  dynamodb-local-test:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "4566:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ | grep -q 'DynamoDB'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── SurrealDB (F4 RequiresDockerFact – SurrealDB) ─────────────────────────
  surrealdb-test:
    image: surrealdb/surrealdb:latest
    command: start --log info --user root --pass root memory
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── SQL Server (F4 RequiresDockerFact – SqlServer) ────────────────────────
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Agxiome_Test!2024"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Agxiome_Test!2024 -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
